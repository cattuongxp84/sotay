<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay Gia đình</title>

<!-- ====== Thông tin icon & ứng dụng ====== -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5b54ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ tay GĐ">

<script>
/* ============================================================
   CHỈ CẦN SỬA 2 DÒNG NÀY
   ------------------------------------------------------------
   APP_URL : link Ứng dụng web Apps Script (kết thúc bằng /exec)
   MODE    : 'redirect' – an toàn, dùng được khi web app để
                          "Chỉ mình tôi" hoặc yêu cầu đăng nhập Google
             'iframe'   – liền mạch như app thật, CHỈ dùng khi
                          web app để quyền "Bất kỳ ai"
   ============================================================ */
const APP_URL = 'https://script.google.com/macros/s/AKfycbwppwGfTwqxv3xTiPdjhkV8dcBU4fJQ0gpEKeoigrvNgGu0j8XVICYhNK0BgUYOx8U/exec';
const MODE    = 'redirect';
</script>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#f4f5fa;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(150deg,#5b54ec,#7c3aed 60%,#c026d3);color:#fff;transition:opacity .35s}
  #splash img{width:112px;height:112px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:pop .5s ease}
  #splash h1{margin:0;font-size:24px;font-weight:800}
  #splash p{margin:0;opacity:.85;font-size:14px}
  .dots{display:flex;gap:6px;margin-top:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.4;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{50%{opacity:1;transform:translateY(-4px)}}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding:env(safe-area-inset-top) 0 0;background:#f4f5fa}
  #err{display:none;max-width:420px;margin:0 20px;background:rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.5;text-align:center}
  #err a{color:#fff;font-weight:700}
  #install{display:none;margin-top:8px;border:0;background:#fff;color:#5b54ec;font-weight:800;font-size:15px;padding:12px 22px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  #help{display:none;max-width:400px;margin:4px 22px 0;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px 18px;font-size:14px;line-height:1.55}
  #help ol{margin:8px 0 0;padding-left:20px}#help li{margin:4px 0}#help p{margin:8px 0 0}
  #openNow{display:none;color:#fff;opacity:.85;font-size:13.5px;margin-top:4px}
  #splash{padding:24px;text-align:center}#help{text-align:left}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-512.png" alt="">
  <h1>Sổ tay Gia đình</h1>
  <p>Công việc · Học tập · Gia đình</p>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
  <button id="install">📲 Cài đặt ứng dụng</button>
  <div id="help"></div>
  <a id="openNow" href="#" onclick="return false">Mở app ngay, không cài →</a>
  <div id="err"></div>
</div>

<script>
// Đăng ký service worker (bắt buộc để Android hiện nút "Cài đặt ứng dụng")
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL);
const err = document.getElementById('err');
const target = ok ? APP_URL + (APP_URL.includes('?') ? '&' : '?') + 'pwa=1' : '';

function openApp(){
  if (!ok) {
    document.getElementById('dots').style.display='none';
    err.style.display='block';
    err.innerHTML='⚠️ Chưa cấu hình link ứng dụng.<br>Mở file <b>index.html</b> và dán link web app (…/exec) vào dòng <b>APP_URL</b>.';
    return;
  }
  if (MODE === 'iframe') {
    const f = document.createElement('iframe');
    f.id='frame'; f.src=target; f.allow='clipboard-write';
    f.onload=()=>{const s=document.getElementById('splash');s.style.opacity=0;setTimeout(()=>s.remove(),350)};
    document.body.appendChild(f);
  } else {
    location.replace(target);
  }
}

// ====== Màn hình cài đặt (khi mở bằng trình duyệt, CHƯA phải từ icon) ======
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const inApp = /Zalo|FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\//i.test(UA);
const isOperaMini = /Opera Mini|OPiOS/i.test(UA);
const isOpera = !isOperaMini && /OPR\/|Opera/i.test(UA);
const notChrome = isOperaMini || /SamsungBrowser|MiuiBrowser|CocCoc|Firefox/i.test(UA);
const ins = document.getElementById('install');
const help = document.getElementById('help');
let deferred = null;

function showSetup(){
  document.getElementById('dots').style.display = 'none';
  help.style.display = 'block';
  let html;
  if (inApp) {
    html = '⚠️ Bạn đang mở trong Zalo/Facebook nên không tạo được icon.<br>Bấm <b>⋯</b> (góc trên) → <b>Mở bằng trình duyệt</b> (chọn <b>Chrome</b>' + (isIOS ? ' / Safari' : '') + ').';
  } else if (isOpera && !deferred) {
    html = '<b>Tạo icon trên Opera:</b><ol><li>Bấm nút <b>⋮</b> (góc trên) hoặc logo <b>O</b> (góc dưới bên phải)</li><li>Chọn <b>Thêm vào…</b> → <b>Màn hình chính</b><br><small>(máy khác có thể ghi “Cài đặt ứng dụng” / “Add to Home screen”)</small></li><li>Bấm <b>Thêm</b></li></ol>';
  } else if (isIOS) {
    html = '<b>Tạo icon trên iPhone:</b><ol><li>Bấm nút <b>Chia sẻ ⬆︎</b> ở thanh dưới Safari</li><li>Chọn <b>Thêm vào MH chính</b></li><li>Bấm <b>Thêm</b></li></ol>';
  } else {
    html = (deferred ? '' : '<b>Tạo icon trên Android:</b><ol><li>Bấm nút <b>⋮</b> góc trên bên phải Chrome</li><li>Chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b></li><li>Bấm <b>Cài đặt / Thêm</b></li></ol>')
         + (notChrome ? (isOperaMini ? '<p>⚠️ Opera Mini không tạo được icon ứng dụng. Hãy mở link bằng <b>Opera</b> (bản thường) hoặc <b>Chrome</b>.</p>' : '<p>⚠️ Nên mở link này bằng <b>Chrome</b> để icon hiển thị đẹp nhất.</p>') : '');
  }
  help.innerHTML = html;
  ins.style.display = deferred ? 'block' : 'none';
  document.getElementById('openNow').style.display = 'block';
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  if (!standalone) showSetup();
});
ins.onclick = async () => {
  if (!deferred) return;
  deferred.prompt();
  const r = await deferred.userChoice;
  deferred = null;
  if (r.outcome === 'accepted') {
    help.innerHTML = '✅ Đã cài xong! Icon <b>Sổ tay GĐ</b> sẽ có trên màn hình chính (hoặc trong ngăn ứng dụng). Từ giờ hãy mở app bằng icon.';
    ins.style.display = 'none';
  } else showSetup();
};
window.addEventListener('appinstalled', () => {
  help.innerHTML = '✅ Đã cài xong! Mở app bằng icon <b>Sổ tay GĐ</b> trên màn hình chính.';
  ins.style.display = 'none';
});
document.getElementById('openNow').onclick = openApp;

// Mở từ icon → vào app luôn. Mở bằng trình duyệt → hiện hướng dẫn cài, KHÔNG tự chuyển trang.
if (standalone) setTimeout(openApp, 400);
else setTimeout(showSetup, 600);
</script>
</body>
</html>
